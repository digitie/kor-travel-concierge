name: frontend
on:
  pull_request:
    paths: ["frontend/**", "tests/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "tests/**", ".github/workflows/frontend.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --strict-peer-deps --no-audit --no-fund
      - run: npm run check:dependencies
      - run: npm run lint -- --max-warnings 0
      - run: npm run doctor
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix ../tests --strict-peer-deps --no-audit --no-fund
      - run: npx --prefix ../tests playwright install --with-deps chromium
      - run: npm --prefix ../tests run test:common-ui
