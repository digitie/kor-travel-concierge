name: frontend
on:
  pull_request:
    paths: ["frontend/**", "tests/**", ".github/workflows/frontend.yml", ".nvmrc", ".github/workflows/common-frontend-policy.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "tests/**", ".github/workflows/frontend.yml", ".nvmrc", ".github/workflows/common-frontend-policy.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci --engine-strict --strict-peer-deps --no-audit --no-fund
      - run: npm run check:dependencies
      - run: npm run lint
      - run: npm run doctor
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix ../tests --engine-strict --strict-peer-deps --no-audit --no-fund
      - run: npx --prefix ../tests playwright install --with-deps chromium
      - run: npm --prefix ../tests run test:common-ui
