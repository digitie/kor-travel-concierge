name: Psycopg source policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psycopg-policy:
    name: Psycopg source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: consumer
          persist-credentials: false

      - name: Checkout immutable Common policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: digitie/kor-travel-common
          ref: b566840cb111fa8b1184498aa892b0fd5ce7e5c6
          path: common
          fetch-depth: 0
          persist-credentials: false

      - name: Set up policy Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Enforce selected application declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/common" rev-parse HEAD)" = b566840cb111fa8b1184498aa892b0fd5ce7e5c6
          python -B "$GITHUB_WORKSPACE/common/tools/check_versions.py" \
            "$GITHUB_WORKSPACE/consumer" \
            --repo kor-travel-concierge \
            --strict-python-application \
            --constraints backend/application-constraints.txt \
            --json "$RUNNER_TEMP/concierge-application-policy.json"


      - name: Verify actual normal install bindings
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s "$GITHUB_WORKSPACE/consumer/backend/tests" -p test_application_build_contract.py
